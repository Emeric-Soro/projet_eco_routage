name: Frontend and API checks

on:
  push:
    branches: ["feat/frontend-foundation"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Responsive browser checks
        run: npm run test:e2e
      - name: Upload visual check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-checks
          path: |
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API test dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall -q api/main.py estimateur_v0.py
      - name: Run HTTP contract tests
        run: python -m unittest discover -s api/tests -v
